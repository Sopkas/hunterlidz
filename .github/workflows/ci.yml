name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            database_url: postgresql://hunter:hunter@localhost:5432/hunter
          - os: ubuntu-latest
            python: "3.14"
            database_url: postgresql://hunter:hunter@localhost:5432/hunter
          # Service containers run on Linux runners only: storage tests are skipped here
          # (ADR-0003); the driver import and the network guard are still tested.
          - os: windows-latest
            python: "3.13"
    services:
      postgres:
        # An empty image skips the service: the Windows job runs without a database.
        image: ${{ matrix.database_url && 'postgres:18.6-alpine' || '' }}
        env:
          POSTGRES_USER: hunter
          POSTGRES_PASSWORD: hunter
          POSTGRES_DB: hunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hunter -d hunter"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      HUNTER_TEST_DATABASE_URL: ${{ matrix.database_url }}
      # Where the database is provided, a storage test that skips is a broken setup.
      HUNTER_TEST_DATABASE_REQUIRED: ${{ matrix.database_url && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: pip check
        run: python -m pip check
      - name: ruff check
        run: python -m ruff check src tests
      - name: ruff format --check
        run: python -m ruff format --check src tests
      - name: pytest (no keys, no network)
        run: python -m pytest -q --durations=5
      - name: smoke — no settings exits with code 2
        shell: bash
        run: |
          set +e
          python -m hunter config
          code=$?
          set -e
          test "$code" -eq 2
