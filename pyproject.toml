[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hunter"
version = "0.1.0"
description = "Hunter v0: lead research, scoring and human-approved outreach drafts"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]

[project.scripts]
hunter = "hunter.runtime.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hunter = ["infrastructure/sqlite/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 10
addopts = "-q"
